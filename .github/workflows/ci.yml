name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install Python test dependencies
        run: python -m pip install "sympy==1.14.0" "mpmath==1.3.0"
      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          [ScriptBlock]::Create((Get-Content -Raw 'scripts/provision.ps1')) | Out-Null
          [ScriptBlock]::Create((Get-Content -Raw 'scripts/deploy.ps1')) | Out-Null
      - name: Unit tests (TypeScript)
        run: npm test
      - name: Unit tests (SymPy kernel)
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts on Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          [ScriptBlock]::Create((Get-Content -Raw 'scripts/provision.ps1')) | Out-Null
          [ScriptBlock]::Create((Get-Content -Raw 'scripts/deploy.ps1')) | Out-Null
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion) syntax OK"
